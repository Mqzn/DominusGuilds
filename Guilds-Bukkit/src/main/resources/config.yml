# Guilds-Bukkit Configuration File

# Redis Configuration
redis:
  host: localhost
  port: 6379
  password: null
  database: 0
  timeout: 2000
  pool:
    maxTotal: 8
    maxIdle: 8
    minIdle: 0
    testOnBorrow: true
    testOnReturn: true

# Buff Configuration (example)
# buffs:
#   "guild-id-here":
#     1:
#       - type: SPEED
#         amplifier: 1
#     2:
#       - type: SPEED
#         amplifier: 2
#       - type: REGEN
#         amplifier: 1

# Territory Settings
territory:
  # Messages
  messages:
    enter-territory: "You are now in territory owned by guild: {guild}"
    leave-territory: "You are now in unclaimed territory."
    build-denied: "You cannot break blocks in claimed territory."
    place-denied: "You cannot place blocks in claimed territory."